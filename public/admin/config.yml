# Homezai content editor.
#
# This file is served publicly at https://homezai.com/admin/config.yml and that is
# fine. It contains no credential and grants nothing. What it does is point the
# editor at Homezai rather than at GitHub, which is the whole of the sign in change.
#
# Every read and every write the editor performs now goes to the Homezai backend at
# the api_root below. That endpoint resolves the caller's short lived Homezai editor
# session to a Homezai user, re-runs the canonical Homezai Admin rule against the
# database FOR EVERY REQUEST, and only then talks to GitHub, using a credential that
# lives on the server and is scoped to the single private content repository. The
# browser never holds a GitHub credential of any kind, and losing Homezai Admin
# status stops the next request rather than the next sign in.
#
# Nothing here is an authorization decision. This file is configuration on a static
# page that anybody can read and edit a copy of; a person who did that would get an
# editor whose every request is refused.
#
# The repository here is deliberately NOT the public site repository. Drafts live only
# in the private one. A publish workflow copies articles whose status is "published"
# into the public repository, so an unpublished article has no path to the public web.
#
# There is no scheduling. Publishing is immediate, and no field here suggests otherwise.

backend:
  name: github
  repo: frankhli843/homezai-content
  branch: main

  # Where the editor's GitHub API calls actually go. The editor appends "/api/v3" to
  # any REST root that does not already end in it, and requires the GraphQL root to
  # end in "/graphql", so both are written here in the form the editor will use rather
  # than in a tidier form it would then rewrite. Those two rules were read out of the
  # deployed editor bundle, and a backend test recomputes them and asserts each
  # resulting URL hits a registered route.
  api_root: https://api.dev.homezyai.com/api/v1/blog-editor/gh/api/v3
  graphql_api_root: https://api.dev.homezyai.com/api/v1/blog-editor/gh/graphql

  # Sign in. "oauth" is the only method offered, which is what removes the paste a
  # personal access token screen entirely: there is no longer a token for anyone to
  # create, paste, lose or forget to revoke. The one remaining method opens
  # app.homezai.com, which is the origin the Homezai session cookie belongs to, and
  # that page decides. An empty list is a configuration error in the editor, so this
  # is the narrowest the surface can be made.
  auth_methods: ['oauth']
  base_url: https://app.homezai.com
  auth_endpoint: api/blog-editor/authorize

  # Stated rather than inferred from window.location, so the relay is handed a value
  # that does not change with the address the editor happens to be served from. The
  # relay matches it against its own allow list and refuses anything else before it
  # mints a session.
  site_domain: homezai.com

  commit_messages:
    create: 'Create article "{{slug}}"'
    update: 'Update article "{{slug}}"'
    delete: 'Delete article "{{slug}}"'
    uploadMedia: 'Upload image {{path}}'
    deleteMedia: 'Delete image {{path}}'

# Uploads land here in the private repository.
media_folder: content/media
# ...and are served from here once published, which is what a post body must reference.
public_folder: /blog-media

# Client side image handling. The server side pipeline in the publish workflow is the
# boundary that actually enforces type, size and metadata stripping; this only saves
# Nina from uploading a 12 MB phone photograph in the first place.
media_libraries:
  default:
    config:
      max_file_size: 8388608
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 1600
  # No stock photo providers. The publish step only accepts an image that lives in
  # this repository's media folder, so offering Unsplash or Pexels in the picker would
  # be offering a choice that fails at publish time. An editor must not show a control
  # the pipeline will refuse.
  stock_assets:
    providers: []

collections:
  - name: posts
    label: Articles
    label_singular: Article
    description: >-
      Write, illustrate and publish a Homezai article. Nothing you write is public
      until Status is set to Published and you save.
    folder: content/posts
    create: true
    delete: true
    slug: '{{fields.slug}}'
    identifier_field: title
    summary: '{{title}}  ({{status}})'
    sortable_fields: ['updatedAt', 'publishedAt', 'title']
    view_groups:
      - label: Status
        field: status
    fields:
      - name: id
        label: Internal id
        widget: uuid
        hint: Minted once when the article is created. It never changes, even if the web address does.

      - name: title
        label: Title
        widget: string
        hint: The headline readers see, and the default browser tab and share title.

      - name: slug
        label: Web address
        widget: string
        pattern:
          - '^[a-z0-9]+(-[a-z0-9]+)*$'
          - Lowercase letters, numbers and single hyphens only.
        # No angle brackets. A hint is rendered as HTML, so "<this>" was parsed as a
        # tag and dropped, and Nina read "The article lives at homezai.com/blog// ."
        hint: >-
          The article lives at homezai.com/blog/ followed by this address and a
          trailing slash. Changing it keeps the old address working as a redirect.

      - name: excerpt
        label: Summary
        widget: text
        maxlength: 300
        hint: One or two sentences. Shown on cards and used as the search and social description.

      - name: status
        label: Status
        widget: select
        default: draft
        options:
          - label: Draft, visible only here
            value: draft
          - label: Published, live on homezai.com
            value: published
        hint: Publishing is immediate. There is no scheduling.

      - name: author
        label: Byline
        widget: select
        default: Homezai Team
        options: ['Homezai Team', 'Nina Fabbri', 'Brian Schoedel']

      - name: heroImage
        label: Hero image
        widget: image
        required: false
        # No "Enter URL". The publish step only accepts a hero that lives in this
        # repository's media folder, so a typed in web address is a control that can
        # only ever fail at publish time, and the picker opened on it by default.
        choose_url: false
        hint: >-
          Required before publishing. This is also the image that appears when the
          article is shared. JPEG, PNG or WebP, up to 8 MB.

      - name: heroImageAlt
        label: Hero image description
        widget: string
        required: false
        hint: >-
          Describe the image for someone using a screen reader. Required unless the
          image is purely decorative.

      - name: heroImageDecorative
        label: The hero image is purely decorative
        widget: boolean
        default: false
        required: false

      - name: featured
        label: Show on the home page
        widget: boolean
        default: false
        required: false
        hint: The home page shows the three lowest ordered featured articles.

      - name: featureOrder
        label: Home page order
        widget: number
        value_type: int
        default: 10
        required: false
        hint: Lower comes first. Ties fall back to the newest article.

      - name: tags
        label: Tags
        widget: list
        required: false

      - name: seoTitle
        label: Search title override
        widget: string
        required: false

      - name: seoDescription
        label: Search description override
        widget: text
        required: false
        maxlength: 300

      # No `format` on either date, on purpose. The editor reads a format string as Day.js
      # tokens, so the date-fns style "yyyy-MM-dd'T'HH:mm:ss.SSSX" that used to be here
      # was saved as `yyyy-10-Th'T'22:55:00.000X` (`dd` is the weekday in Day.js) and
      # every publish of that article was refused. Without a format, a UTC picker stores
      # an ISO 8601 instant ending in Z, which is what the publish step accepts.
      - name: publishedAt
        label: Published
        widget: datetime
        required: false
        picker_utc: true
        hint: Set automatically when you first publish. Leave it alone unless you are correcting a date. Times are in UTC.

      - name: updatedAt
        label: Last updated
        widget: datetime
        required: false
        picker_utc: true

      - name: previousSlugs
        label: Previous web addresses
        widget: list
        required: false
        hint: Kept automatically so old links keep working. You should not need to edit this.

      - name: body
        label: Article
        widget: markdown
        hint: >-
          Headings, lists, quotes, links and images. Raw HTML is not accepted and is
          shown as plain text if you paste it.
